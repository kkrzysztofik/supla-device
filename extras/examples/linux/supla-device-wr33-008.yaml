# SMA WR33-008 (SN 2000497368) — supla-device-linux + SMA/Ingecon extensions
#
# Build:
#   ./build-sma-ingecon.sh
#
# Edit before first run:
#   - supla.mail / supla.server (your SUPLA Cloud account)
#   - serial.device (same path as yasdi-posix.ini [COM1] Device=)
#
# On first start, GUID and AuthKey are generated under state_files_path.
# Register the device in SUPLA Cloud using the values from:
#   var/supla-wr33-008/guid_auth.yaml
#
# Hardware (profiled with yasdishell):
#   Model WR33-008, net_address 0x0001, SMANet RS485 @ 1200 baud

name: "WR33-008 SN:2000497368"
log_level: info
proto_verbose_log: false
state_files_path: "./var/supla-wr33-008"
security_level: 0

supla:
  server: svr1.supla.org
  mail: YOUR_EMAIL@example.com
  proto: 23

channels:
  - type: SmaInverter
    caption: WR33 AC
    serial: &sma_serial
      device: /dev/ttyUSB0
      baud: 1200
      media: RS485
    device: &sma_device
      net_address: 1
      profile: WR33-008
    poll_interval_sec: 15
    sma_channels:
      Pac: power_active
      Uac: voltage
      Fac: frequency
      "Iac-Ist": current
      "E-Total": rvr_act_energy

  - type: SmaDcMeter
    caption: WR33 DC
    serial: *sma_serial
    device: *sma_device
    poll_interval_sec: 15
    sma_channels:
      "Upv-Ist": voltage
      Ipv: current

  - type: SmaThermometer
    caption: WR33 temperature
    serial: *sma_serial
    device: *sma_device
    poll_interval_sec: 15
    sma_channels:
      Tkk: temperature

  - type: SmaMeasurement
    caption: WR33 grid impedance
    serial: *sma_serial
    device: *sma_device
    poll_interval_sec: 15
    default_unit_after_value: "Ohm"
    default_value_precision: 3
    sma_channels:
      Zac: measurement
