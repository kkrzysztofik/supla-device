# Example sd4linux config with SMA RS485 extension enabled at build time:
# cmake -B build -DSUPLA_LINUX_EXTENSION_DIRS=../../../porting/linux/extensions/sma

device:
  name: supla-device-sma
  guid: 00000000-0000-0000-0000-000000000001
  auth_key: ""

network:
  mode: LAN
  server: svr1.supla.org
  email: user@example.com

channels:
  - type: SmaInverter
    serial:
      device: /dev/ttyUSB0
      baud: 1200
      media: RS485
    device:
      net_address: 1
    poll_interval_sec: 15
    # Channel names must match YASDI/yasdishell (e.g. "Pac", "E-Total").
    # ctype, cindex, gain, and ntype are fetched from the inverter via CINFO.
    sma_channels:
      Pac: power_active
      Uac: voltage
      Fac: frequency
      "E-Total": fwd_act_energy
