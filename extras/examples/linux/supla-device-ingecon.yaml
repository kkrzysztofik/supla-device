# Example sd4linux config with SMA and Ingecon extensions enabled:
#   ./build-sma-ingecon.sh
#
# Set supla.mail, supla.server, and serial.device before running.

name: supla-device-ingecon
log_level: info
proto_verbose_log: false
state_files_path: "./var/supla-device-ingecon"
security_level: 0

supla:
  server: svr1.supla.org
  mail: user@example.com
  proto: 23

channels:
  - type: IngeconInverter
    caption: INGECON AAS1340_U AC
    serial: &ingecon_serial
      device: /dev/ttyUSB0
      baud: 9600
      rts_toggle: true
    device: &ingecon_device
      modbus_address: 240
      profile: aas1340_u
    poll_interval_sec: 15
    energy_mapping: reverse

  - type: IngeconDcMeter
    caption: INGECON AAS1340_U DC
    serial: *ingecon_serial
    device: *ingecon_device
    poll_interval_sec: 15

  - type: IngeconMeasurement
    caption: INGECON alarms
    serial: *ingecon_serial
    device: *ingecon_device
    poll_interval_sec: 15
    ingecon_value: alarms
    default_unit_after_value: ""
    default_value_precision: 0

  - type: IngeconMeasurement
    caption: INGECON operation hours
    serial: *ingecon_serial
    device: *ingecon_device
    poll_interval_sec: 15
    ingecon_value: hours_running
    default_unit_after_value: "h"
    default_value_precision: 0

  - type: IngeconMeasurement
    caption: INGECON grid connections
    serial: *ingecon_serial
    device: *ingecon_device
    poll_interval_sec: 15
    ingecon_value: grid_connections
    default_unit_after_value: ""
    default_value_precision: 0

  - type: IngeconMeasurement
    caption: INGECON alarm inverter
    serial: *ingecon_serial
    device: *ingecon_device
    poll_interval_sec: 15
    ingecon_value: alarm_inverter
    default_unit_after_value: ""
    default_value_precision: 0

  - type: IngeconMeasurement
    caption: INGECON alarm safety
    serial: *ingecon_serial
    device: *ingecon_device
    poll_interval_sec: 15
    ingecon_value: alarm_safety
    default_unit_after_value: ""
    default_value_precision: 0
